name: CI and deploy

on:
  push:
    branches: [main, rebuild-trip-planner]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: 9c3bb12edbab6db746c28e5b53c4d59d

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    environment: production
    env:
      CLOUDFLARE_API_TOKEN_INPUT: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare Cloudflare API token
        if: env.CLOUDFLARE_API_TOKEN_INPUT != ''
        run: |
          token="$CLOUDFLARE_API_TOKEN_INPUT"
          if [[ "$token" == *"Authorization: Bearer "* ]]; then
            token="${token#*Authorization: Bearer }"
            token="${token%%\"*}"
          fi
          token="${token//$'\r'/}"
          token="${token//$'\n'/}"
          if [[ ! "$token" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "Cloudflare API token has an unsupported format." >&2
            exit 1
          fi
          echo "::add-mask::$token"
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
      - run: pnpm build
      - run: pnpm wrangler d1 migrations apply DB --remote
        if: env.CLOUDFLARE_API_TOKEN_INPUT != ''
      - run: pnpm wrangler deploy
        if: env.CLOUDFLARE_API_TOKEN_INPUT != ''

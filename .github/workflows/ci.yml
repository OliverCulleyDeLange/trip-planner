name: CI and deploy

on:
  push:
    branches: [main, rebuild-trip-planner]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: 9c3bb12edbab6db746c28e5b53c4d59d

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  deploy-preview:
    if: github.event_name == 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    environment: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          CLOUDFLARE_ENV: preview
      - run: pnpm wrangler d1 migrations apply DB --remote --env preview
        if: env.CLOUDFLARE_API_TOKEN != ''
      - run: pnpm wrangler deploy --env preview
        if: env.CLOUDFLARE_API_TOKEN != ''

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm wrangler d1 migrations apply DB --remote
        if: env.CLOUDFLARE_API_TOKEN != ''
      - run: pnpm wrangler deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
